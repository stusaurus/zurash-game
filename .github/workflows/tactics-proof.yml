name: Tactics exact proof depth
on:
  pull_request:
    paths:
      - 'scripts/tactics-proof*.js'
      - 'tests/tactics-proof.test.js'
      - 'tests/tactics-oracle*.js'
      - '.github/workflows/tactics-proof.yml'
  workflow_dispatch:
  push:
    branches: [tactics-size-experiment]
    paths:
      - 'scripts/tactics-proof*.js'
      - 'tests/tactics-proof.test.js'
      - 'tests/tactics-oracle*.js'
      - '.github/workflows/tactics-proof.yml'
concurrency:
  group: tactics-proof-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  proof-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact solver independently of long-running research
        run: node --test tests/tactics-proof.test.js tests/tactics-oracle.test.js
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test proof correctness
        run: node --test tests/tactics-proof.test.js tests/tactics-oracle.test.js
      - name: Measure proof limits
        env:
          PROOF_BUDGET: '1000000'
          PROOF_DEPTH: '16'
          PROOF_TIME_MS: '5000'
          PROOF_TOTAL_MS: '90000'
        run: node --max-old-space-size=768 scripts/tactics-proof-study.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactics-exact-proof-depth
          path: reports/tactics-proof-depth.json
          if-no-files-found: ignore
