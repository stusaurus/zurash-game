name: B and D fairness diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and run B/D diagnostics
        run: |
          node --check scripts/bd-fairness-diagnostics.js
          node scripts/bd-fairness-diagnostics.js
          node --check scripts/bd-fairness-candidates.js
          node scripts/bd-fairness-candidates.js
          node --check scripts/bd-fairness-pilot.js
          node scripts/bd-fairness-pilot.js
          node --check scripts/bd-fairness-holdout.js
          node scripts/bd-fairness-holdout.js
          node --check scripts/bd-fairness-decision.js
          node scripts/bd-fairness-decision.js
      - name: Validate output
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const r=JSON.parse(readFileSync('reports/fairness-diagnostics/BD-static.json')); assert.deepEqual(r.modes.map(x=>x.id),['B','D']); for(const x of r.modes){assert.equal(x.players.length,2);assert.ok(Number.isFinite(x.base.proxyBias));assert.ok(Number.isFinite(x.swappedProxy.proxyBias));}"
      - name: Archive diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: bd-fairness-${{ github.run_id }}
          path: |
            reports/fairness-diagnostics/BD-static.json
            reports/fairness-diagnostics/BD-candidates.json
            reports/fairness-diagnostics/BD-paired-pilot.json
            reports/fairness-diagnostics/D-holdout.json
            reports/fairness-diagnostics/BD-decision.json
          retention-days: 30
