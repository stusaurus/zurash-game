name: Two-wall powered forced-win audit
on:
  push:
    branches: [experiment/two-wall-forced-win-audit]
    paths:
      - .github/workflows/two-wall-powered-win.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  powered-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Verify rules and prior forced-winning replay
        run: npm test
      - name: Search for certified power-assisted forcing line in contested positions
        env:
          GAMES: "40"
          PLY_CAP: "25"
          STATES: "100"
          OPPONENT_MIN_SCORE: "1"
          REQUIRE_POWER: "1"
          CALL_BUDGET: "30000"
          CLOCK_MS: "720000"
          SEED: "7717901"
          CURRY_PAIRS: "21,27;5,43"
          REPORT: reports/two-wall-powered-forced-win.json
        run: node scripts/two-wall-forced-win.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-wall-powered-winning-tactics
          path: reports/two-wall-powered-forced-win.json
          retention-days: 90
