name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test && npm run check
      - name: Prepare static files only
        run: |
          mkdir -p dist/src dist/assets
          # Publish all root-level stylesheets. The ice-world and mobile
          # HUD are loaded dynamically, so omitting them silently breaks the UI.
          cp index.html *.css dist/
          for stylesheet in style.css world.css world-mobile.css mobile-hud.css mobile-focus.css mobile-tap.css; do
            test -s "dist/${stylesheet}"
          done
          cp src/*.js dist/src/
          # Publish every committed visual asset, including future sprite frames.
          cp -a assets/. dist/assets/
          # Fail the deployment if any approved character color is missing.
          for color in orange aqua lime purple; do
            test -s "dist/assets/triken-${color}-80.png"
          done
          test -s dist/assets/triken-reference.jpeg
          test -s dist/assets/triken-four-colors.webp
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published Triken images
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}/assets"
          for color in orange aqua lime purple; do
            asset="triken-${color}-80.png"
            # The Pages CDN may need a short propagation window after deployment.
            ok=false
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location --max-time 10                 "${base}/${asset}?build=${GITHUB_SHA}" -o "/tmp/${asset}"                 && cmp -s "dist/assets/${asset}" "/tmp/${asset}"; then
                echo "Confirmed live image: ${asset}"
                ok=true
                break
              fi
              sleep 5
            done
            test "${ok}" = true
          done
