name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test && npm run check
      - name: Prepare static files only
        run: |
          mkdir -p dist/src dist/assets
          cp index.html style.css dist/
          cp src/*.js dist/src/
          # Publish every committed visual asset, including future sprite frames.
          cp -a assets/. dist/assets/
          # Fail the deployment if any approved character color is missing.
          for color in orange aqua lime purple; do
            test -s "dist/assets/triken-${color}-80.png"
          done
          test -s dist/assets/triken-reference.jpeg
          test -s dist/assets/triken-four-colors.webp
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
