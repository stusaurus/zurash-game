name: Tactics exhaustive opening study
on:
  workflow_dispatch:
  push:
    branches: [tactics-size-experiment]
    paths:
      - 'scripts/tactics-search.js'
      - 'scripts/tactics-search-study.js'
      - '.github/workflows/tactics-search-study.yml'
permissions:
  contents: read
jobs:
  openings:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Search regression tests
        run: node --test tests/tactics-search.test.js
      - name: Enumerate and compare opening choices
        env:
          DEPTH: '2'
          NODE_BUDGET: '12000'
          SAMPLES: '3'
        run: node scripts/tactics-search-study.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactics-all-openings
          path: reports/tactics-search-study.json
          if-no-files-found: ignore
