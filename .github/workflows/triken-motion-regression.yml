name: Triken motion regression
on:
  pull_request:
    paths:
      - "src/app.js"
      - "style.css"
      - "index.html"
      - "tests/browser/motion-toggle.spec.js"
      - ".github/workflows/triken-motion-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  glide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install Chromium without OS package refresh
        run: npx playwright install chromium
        timeout-minutes: 5
      - name: Verify actual mid-cell movement
        run: npx playwright test tests/browser/motion-toggle.spec.js --project=chromium --workers=1
        timeout-minutes: 5
