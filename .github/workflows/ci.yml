name: Game quality
on:
  push:
    branches: [main, "feat/**"]
    paths-ignore: ["README.md", "reports/**"]
  pull_request:
    paths-ignore: ["README.md", "reports/**"]
permissions:
  contents: read
jobs:
  rules:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check && npm test
      - name: Reuse and independently replay the five-mode readiness cohort
        run: |
          node --max-old-space-size=768 scripts/balanced-audit.js
          node scripts/membership-benchmark.js --verify
          git diff --exit-code -- reports/balanced-2026-10-25.md reports/balanced-2026-10-25/
      - name: Stage two independent transitions, frozen CPU choices and extensions
        run: |
          node --max-old-space-size=768 scripts/stage2-regression.js --verify
          node --max-old-space-size=768 scripts/stage2-performance.js --verify
          node --max-old-space-size=768 scripts/stage2-continuation.js --verify
          node --max-old-space-size=768 scripts/stage2-analysis.js --verify
          node --max-old-space-size=768 scripts/stage3-study.js --verify
          node --check src/playtest-record.js
          node --max-old-space-size=768 scripts/stage3-positions.js --verify
          node --max-old-space-size=768 scripts/stage4-a.js --verify
          node --max-old-space-size=768 scripts/stage5-verify.js
      - run: PAIRS=2 MAX_PLIES=35 MATCHUPS=greedy/greedy npm run quality:audit
      - run: LAYOUT_TRIALS=20 PAIRS=2 MAX_PLIES=25 npm run quality:layouts
      - run: PAIRS=1 MAX_PLIES=12 MATCHUPS=greedy/greedy REPORT=/tmp/strategy-smoke.json npm run quality:study
      - run: npm run quality:replay -- /tmp/strategy-smoke.json
      - run: PAIRS=1 MAX_PLIES=20 SEED_OFFSET=9000071 RNG_MODE=worker MATCHUPS=route/legacy-strong REPORT=/tmp/route-smoke.json npm run quality:study
      - run: npm run quality:replay -- /tmp/route-smoke.json
  browsers:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Match package-lock.json; browser binaries and native libraries are preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: |
            playwright-report/
            test-results/
          retention-days: 14
