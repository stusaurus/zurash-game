name: Game quality
on:
  push:
    branches: [main, "feat/**"]
    paths-ignore: ["README.md", "reports/**"]
  pull_request:
    paths-ignore: ["README.md", "reports/**"]
permissions:
  contents: read
jobs:
  rules:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check && npm test
      - name: Reproduce bounded tactical contracts and archived B checkpoints
        run: |
          node --max-old-space-size=768 scripts/guard-contract.js --verify
          node --max-old-space-size=768 scripts/guard-contract.js --archived --verify
      - run: PAIRS=2 MAX_PLIES=35 MATCHUPS=greedy/greedy npm run quality:audit
      - run: LAYOUT_TRIALS=20 PAIRS=2 MAX_PLIES=25 npm run quality:layouts
      - run: PAIRS=1 MAX_PLIES=12 MATCHUPS=greedy/greedy REPORT=/tmp/strategy-smoke.json npm run quality:study
      - run: npm run quality:replay -- /tmp/strategy-smoke.json
      - run: PAIRS=1 MAX_PLIES=20 SEED_OFFSET=9000071 RNG_MODE=worker MATCHUPS=route/legacy-strong REPORT=/tmp/route-smoke.json npm run quality:study
      - run: npm run quality:replay -- /tmp/route-smoke.json
  browsers:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Match package-lock.json; browser binaries and native libraries are preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: |
            playwright-report/
            test-results/
          retention-days: 14
