name: B settlement staged research
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b-settlement-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/b-settlement.test.js
      - run: timeout 9m node --max-old-space-size=768 scripts/b-settlement-study.js
      - run: node --max-old-space-size=768 scripts/b-settlement-study.js --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b-settlement
          path: reports/b-settlement-2026-10-23/
          retention-days: 90
