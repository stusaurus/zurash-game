name: Standard 9x9 trial QA

on:
  pull_request:
    paths:
      - "src/trial-layouts.js"
      - "src/engine.js"
      - "src/app.js"
      - "index.html"
      - "tests/standard-trial.test.js"
      - "tests/browser/standard-trial.spec.js"
      - ".github/workflows/standard-trial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legal-and-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check && node --test tests/standard-trial.test.js
      - run: npx playwright install --with-deps chromium webkit
      - name: Real 9x9 play in Chromium, WebKit and iPhone-like WebKit
        run: npx playwright test tests/browser/standard-trial.spec.js --project=chromium --project=webkit --project=iphone-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standard-9x9-trial-screenshots
          path: |
            test-results/
            playwright-report/
          retention-days: 14
